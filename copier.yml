_subdirectory: template

node_version:
  type: str
  help: Which nodejs version you want to use?
  default: "22"

enable_docker_in_docker:
  type: bool
  help: Enable Docker-in-Docker support (docker build, docker compose inside the devcontainer)?
  default: false

enable_python_uv:
  type: bool
  help: Enable Python UV setup (installs Python3, python3-venv, and UV package manager)?
  default: false

enable_plone:
  type: bool
  help: Enable Plone support (installs plonecli, Python and uv; allows dist.plone.org and PyPI in firewall)?
  default: false

enable_pnpm:
  type: bool
  help: Enable JavaScript pnpm setup (enables corepack and prepares pnpm)?
  default: false

enable_terminal_recording:
  type: bool
  help: Enable terminal recording tools (asciinema, ffmpeg, vhs, agg, ttyd) for scripted demos?
  default: false

enable_zellij:
  type: bool
  help: Enable Zellij terminal multiplexer with zjstatus and zj-status-bar status bar plugins?
  default: false

agents:
  type: str
  help: Which coding agent CLIs should be installed (and allowed through the firewall)?
  multiselect: true
  choices:
    Claude Code: claude code
    Mistral Vibe: mistral vibe
    OpenCode: open code
    Pi: pi
  validator: "{% if not agents %}Select at least one coding agent.{% endif %}"

searxng_url:
  type: str
  help: |
    SearXNG base URL for the Pi rpiv-web-tools web_search provider.
    The default points at a SearXNG instance running on the Docker host
    (host.docker.internal is wired up automatically for the container).
  default: "http://host.docker.internal:8099"
  when: "{{ 'pi' in agents }}"

extra_mounts:
  type: yaml
  help: |
    Extra devcontainer mount entries (list of strings, exactly as they would
    appear inside devcontainer.json "mounts"). Stored in the answers file and
    preserved across copier updates.
    Example:
      - source=${localEnv:HOME}/develop/plone/src/copier-templates,target=/home/node/develop/plone/src/copier-templates,type=bind,consistency=delegated
  default: []
